name: Capturar snapshot pre-abertura

on:
  workflow_dispatch:
  schedule:
    # 09:50 BRT (America/Bahia = UTC-3), em dias úteis.
    - cron: "50 12 * * 1-5"

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install .

      - name: Capturar preços disponíveis às 09:50 BRT
        run: python -m rrquant.snapshot

      - name: Versionar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/pre_abertura.csv
          git diff --cached --quiet || git commit -m "Registra snapshot pre-abertura"
          git push
