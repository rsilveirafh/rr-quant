name: Atualizar dashboard

on:
  workflow_dispatch:
  schedule:
    # 08:00 no horario da Bahia (UTC-3), de segunda a sexta.
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install .

      - name: Gerar dashboard
        run: python -m rrquant

      - name: Publicar HTML no repositorio
        run: |
          mkdir -p public
          cp output/dashboard.html public/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet || git commit -m "Atualiza dashboard diario"
          git push
