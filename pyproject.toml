[project]
name = "rr-quant"
version = "0.1.0"
description = "Dashboard quant + varredura diaria de mercado (inspirado na leitura pre-mercado da Rebecca Parriao)"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.5",
    "pandas>=2.0",
]

[project.scripts]
rrquant = "rrquant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
